const introductions=[["衬衫", "浆洗好的白衬衫。板正笔挺，几乎像纸一样的触感。大概用了很多的化学洗剂才能达到这个程度。完全没有气味啊。"], ["光学聚焦器", "地狱没有阳光。“不见天日”，对么？被用以聚集烛光，火光，目光"], ["这是啥", "这是啥？哪个机器上掉下来的橡胶盖。有鬼要倒霉了。"], ["墨水", "一瓶墨水。"], ["墨水", "另一瓶墨水。"], ["液体容器（有星形标识）", "和大厂工牌一个道理。"], ["点燃器", "它会让你很烫！小心点。"], ["被点燃器", "卷着一些烟草……我希望只是烟草。"], ["保护你的财物", "带着它去赚取更多财产吧，没有生产资料的可怜人。"], ["背包底部肮脏的小纸片……别说你没有。", "没人知道这是什么。翻开这张口香糖包装纸，你也许会看到一串女人用眼线胶笔写下的电话号码。"], ["止痛药", "不是那种不需要处方的垃圾货。你、你在暗示这是吗啡的类似物吗？啊……奇怪的是。他只用它们来克制头痛，而并不滥用。"], ["尖锐物品（请进黄色医疗废物箱）", "因为他更爱滥用这个。"], ["薄荷味粒状清口糖", "是么？里面也许有几粒西地那非。不，只是……也许。"], ["亲人", "死者的遗物。"], ["街上发的能量棒", "暂时还饿不死。"], ["黑框，黑框", "黑框，黑框……死人有什么好黑框的？全家福而已，就差一个人就可以变成全家大遗照了。"], ["Михаил Юрьевич Игнатов", "完完全全是一个普通的，可悲的男人。拼尽全力也只是存活着而已。已经完全忘记存活的意义是什么却也想要活下去的人。"], ["Marzanna", "想让Михаил Юрьевич Игнатов死的人。(Don't take it personally!)"], ["专武", "收割灵魂用的镰刀。"], ["笔记本，以及", "世界上最难搞定的客户档案。"], ["身份证件", "丢了这个，你可得费点功夫才能和长官们证明你是你了。"], ["bullshit", "本故事纯属虚构，人物、背景、情节皆为艺术创作，请勿与现实人物及事件对号入座。"], ["肛塞", "别那么叫钢笔！真不礼貌。"], ["培养皿", "我的意思是，浴缸。"]];
let selected=null;
regions.sort((a,b)=>(a.id===24?-1:b.id===24?1:0));
regions.forEach(region=>{
 const clip=document.createElementNS(svgNS,'clipPath');clip.id='region-'+region.id;
 const polygon=document.createElementNS(svgNS,characterPaths[region.id]?'path':'polygon');
 if(characterPaths[region.id]){polygon.setAttribute('d',characterPaths[region.id]);polygon.setAttribute('fill-rule','evenodd');}else polygon.setAttribute('points',region.points);
 const contour=contours[region.id] ? document.createElementNS(svgNS,'path') : polygon.cloneNode();
 if(contours[region.id])contour.setAttribute('d',contours[region.id]);
 clip.append(contour);defs.append(clip);
 // The arm shares the character's visual layer and introduction.
 const isArm=false;
 const group=isArm ? layer.querySelector('[data-region="17"]') : document.createElementNS(svgNS,'g');
 if(!isArm){group.classList.add('piece');if(region.id===17||region.id===18)group.classList.add('character');group.setAttribute('tabindex','0');group.setAttribute('role','button');group.setAttribute('aria-label',introductions[region.id-1][0]);group.dataset.region=region.id;
 const mask=document.createElementNS(svgNS,'mask');mask.id='mask-'+region.id;mask.setAttribute('maskUnits','userSpaceOnUse');mask.setAttribute('x','0');mask.setAttribute('y','0');mask.setAttribute('width','1536');mask.setAttribute('height','1612');mask.style.maskType='alpha';
 const maskImage=document.createElementNS(svgNS,'image');maskImage.setAttribute('href','../explore/masks/'+region.id+'.png');maskImage.setAttribute('width','1536');maskImage.setAttribute('height','1612');mask.append(maskImage);defs.append(mask);
 const visual=document.createElementNS(svgNS,'g');visual.classList.add('visual');
 const image=document.createElementNS(svgNS,'image');image.setAttribute('href','../explore/art.png');image.setAttribute('width','1536');image.setAttribute('height','1612');image.setAttribute('mask','url(#'+mask.id+')');image.setAttribute('pointer-events','none');visual.append(image);group.append(visual);}
 const outline=polygon.cloneNode();outline.classList.add('outline');group.append(outline);
 // Transparent polygon owns hit testing, including black space in the marked area.
 const hit=polygon.cloneNode();hit.setAttribute('fill','transparent');hit.setAttribute('pointer-events','all');group.append(hit);
 if(isArm)return;
 const show=()=>{const [title,description]=introductions[region.id-1];document.getElementById('heading').textContent=title;document.getElementById('description').textContent=description;selected=group;group.classList.add('active');dialog.dataset.region=region.id;const now=new Date();const clock=document.getElementById('dialog-time');clock.dateTime=now.toISOString();clock.textContent=now.toLocaleString();dialog.showModal();};
 group.addEventListener('click',show);group.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();show();}});layer.append(group);
});
document.getElementById('close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',event=>{if(event.target===dialog){const box=dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom)dialog.close();}});
dialog.addEventListener('close',()=>{if(selected){selected.classList.remove('active');selected.focus();}});
document.getElementById('guides').addEventListener('click',event=>{const visible=svg.classList.toggle('guides');event.currentTarget.setAttribute('aria-pressed',String(visible));});
</script>
</html>
